name: Build & release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Incremento de versão a partir da última tag"
        type: choice
        options: [fix, minor, major]
        default: fix

jobs:
  # Só roda em tag push ou disparo manual. No manual, calcula a próxima versão
  # a partir da última tag e cria/empurra a nova tag; o resto do fluxo (build +
  # release) consome needs.version.outputs.version no mesmo run.
  version:
    name: Resolve version
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: resolve
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            last=$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1)
            last=${last:-v0.0.0}
            IFS=. read -r major minor patch <<< "${last#v}"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              fix)   patch=$((patch + 1)) ;;
              *) echo "bump inválido: $BUMP" >&2; exit 1 ;;
            esac
            version="${major}.${minor}.${patch}"
            echo "última tag=$last -> nova=v$version ($BUMP)"
            git tag "v$version"
            git push origin "v$version"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:kde-6.7
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: klinksrouter.flatpak
          manifest-path: packaging/flatpak/store.bighub.KLinksRouter.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: klinksrouter-flatpak-bundle
          path: klinksrouter.flatpak

  macos:
    name: Build macOS .dmg
    needs: version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build .app and .dmg
        run: scripts/build-macos.sh "${{ needs.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: klinksrouter-macos-dmg
          path: KLinksRouter.dmg

  release:
    name: Publish release
    needs: [version, flatpak, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: klinksrouter-flatpak-bundle

      - uses: actions/download-artifact@v4
        with:
          name: klinksrouter-macos-dmg

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          files: |
            klinksrouter.flatpak
            KLinksRouter.dmg
          generate_release_notes: true
