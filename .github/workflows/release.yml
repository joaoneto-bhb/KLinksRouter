name: Build & release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

jobs:
  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:kde-6.7
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: klinksrouter.flatpak
          manifest-path: packaging/flatpak/store.bighub.KLinksRouter.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: klinksrouter-flatpak-bundle
          path: klinksrouter.flatpak

  macos:
    name: Build macOS .dmg
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build .app and .dmg
        run: scripts/build-macos.sh "${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: klinksrouter-macos-dmg
          path: KLinksRouter.dmg

  release:
    name: Publish release
    needs: [flatpak, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: klinksrouter-flatpak-bundle

      - uses: actions/download-artifact@v4
        with:
          name: klinksrouter-macos-dmg

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            klinksrouter.flatpak
            KLinksRouter.dmg
          generate_release_notes: true
